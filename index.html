<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StopBias – Child-Harm Data Explorer (Beta)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Josefin Sans', system-ui, sans-serif;
      background: #fff;
      color: #1a1a1a;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 1rem; }
    .logo-img { height: 42px; width: auto; }
    .title-block { display: flex; flex-direction: column; }
    .main-title {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .main-title .stop { color: #000; }
    .main-title .bias { color: #0cc0df; }
    .tagline {
      font-size: 1.05rem;
      color: #4b5563;
      font-weight: 600;
      margin-top: 0.1rem;
    }
    .badge {
      background: #0cc0df;
      color: white;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      margin-left: 0.4rem;
      vertical-align: middle;
    }
    .country-select {
      font-size: 0.82rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      max-width: 180px;
    }
    .country-select option:disabled { color: #9ca3af; }
    #map { height: calc(100vh - 62px); width: 100%; background: #f1f5f9; }
    #data-panel {
      position: fixed;
      top: 62px;
      right: -460px;
      width: 440px;
      height: calc(100vh - 62px);
      background: #fff;
      border-left: 1px solid #e5e7eb;
      box-shadow: -4px 0 24px rgba(0,0,0,0.10);
      padding: 1.75rem;
      overflow-y: auto;
      transition: right 0.3s ease;
      z-index: 3000;
    }
    #data-panel.open { right: 0; }
    #data-panel h2 { font-size: 1.35rem; margin-bottom: 0.2rem; font-weight: 700; }
    #data-panel .subtitle { color: #6b7280; font-size: 0.95rem; margin-bottom: 1rem; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.6rem; color: #9ca3af; cursor: pointer; }
    .close-btn:hover { color: #111; }
    label { font-size: 0.85rem; color: #374151; display: block; margin-bottom: 0.3rem; font-weight: 600; }
    select { width: 100%; padding: 0.45rem; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 1.2rem; font-size: 0.9rem; font-family: inherit; }
    h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: #6b7280; margin: 1.2rem 0 0.6rem 0; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin-bottom: 0.5rem; }
    th, td { text-align: left; padding: 0.45rem 0.3rem; border-bottom: 1px solid #e5e7eb; }
    th { color: #6b7280; font-weight: 600; }
    .notes { font-size: 0.8rem; color: #6b7280; line-height: 1.45; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; }
    .notes a { color: #0cc0df; }
    .missing { color: #dc2626; font-weight: 600; }
    .legend { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: #6b7280; margin-top: 0.8rem; }
    .red-x { color: #dc2626; font-weight: bold; }
    .crime-note { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 6px; padding: 0.7rem; font-size: 0.85rem; color: #374151; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <!-- Replace src with your logo file once uploaded, e.g. logo.png -->
      <!-- <img src="logo.png" alt="StopBias" class="logo-img"> -->
      <div class="title-block">
        <div class="main-title">
          <span class="stop">Stop</span><span class="bias">Bias</span>
          <span class="badge">Beta</span>
        </div>
        <div class="tagline">Child-Harm Data Explorer</div>
      </div>
    </div>
    <select id="country-select" class="country-select">
      <option value="world" disabled>World (coming)</option>
      <option value="us" selected>United States</option>
      <option value="au" disabled>Australia (coming)</option>
      <option value="ca" disabled>Canada (coming)</option>
      <option value="fr" disabled>France (coming)</option>
      <option value="de" disabled>Germany (coming)</option>
      <option value="it" disabled>Italy (coming)</option>
      <option value="nz" disabled>New Zealand (coming)</option>
      <option value="za" disabled>South Africa (coming)</option>
      <option value="es" disabled>Spain (coming)</option>
      <option value="uk" disabled>United Kingdom (coming)</option>
    </select>
  </header>

  <div id="map"></div>

  <div id="data-panel">
    <button class="close-btn" onclick="closePanel()">×</button>
    <h2>United States</h2>
    <div class="subtitle">Child-related harm data</div>
    <div id="panel-content">Click a state to load data…</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const map = L.map('map').setView([39.5, -98], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 18 }).addTo(map);

      fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
        .then(r => r.json())
        .then(data => {
          const usaLayer = L.geoJSON(data, { style: { color: "#0cc0df", weight: 1.5, fillColor: "#0cc0df", fillOpacity: 0.25 } }).addTo(map);
          usaLayer.on('click', function(e) { L.DomEvent.stopPropagation(e); openPanel(); });
        });

      let usData = null;
      function loadData() {
        return fetch('us-data.json').then(r => { if (!r.ok) throw new Error('us-data.json not found'); return r.json(); })
          .then(data => { usData = data; return data; })
          .catch(err => { document.getElementById('panel-content').innerHTML = '<p class="missing">Could not load data: ' + err.message + '</p>'; throw err; });
      }
      loadData();

      function openPanel() {
        document.getElementById('data-panel').classList.add('open');
        if (usData) renderPanel(usData);
        else { document.getElementById('panel-content').innerHTML = 'Loading data…'; loadData().then(data => renderPanel(data)); }
      }

      function renderPanel(data) {
        const options = data.victim_race_options.map(r => `<option value="${r}">${r}</option>`).join('');
        document.getElementById('panel-content').innerHTML = `
          <div class="crime-note">
            <strong>Current view – Nonfatal violent crime (ages 12–17):</strong><br>
            Rape/sexual assault, robbery, aggravated assault, simple assault.<br>
            Offender race = victim’s perception (NCVS 2012–15).
          </div>
          <label for="victim-race">Select victim race/ethnicity:</label>
          <select id="victim-race">${options}</select>
          <div id="offender-table"></div>

          <h3>Homicide victimization rates (youth under 18)</h3>
          <table>
            <thead><tr><th>Victim race</th><th>Rate per 100,000</th><th>Perpetrator race</th></tr></thead>
            <tbody>
              <tr><td>White</td><td>${data.homicide_rates_per_100k.White}</td><td class="missing">✕ No official data published</td></tr>
              <tr><td>Black</td><td>${data.homicide_rates_per_100k.Black}</td><td class="missing">✕ No official data published</td></tr>
            </tbody>
          </table>
          <p style="font-size:0.8rem;color:#6b7280;margin:0.3rem 0 1rem 0;">${data.homicide_rates_per_100k.note}</p>

          <div class="legend"><span class="red-x">✕</span> No official data published / not provided</div>
          <div class="notes" id="notes-area"></div>
        `;

        const select = document.getElementById('victim-race');
        const updateTable = () => {
          const selected = select.value;
          const row = data.ncvs_cross_tab_12_17[selected];
          if (!row) return;
          const rows = Object.entries(row).map(([offRace, pct]) => `<tr><td>${offRace}</td><td>${pct}%</td></tr>`).join('');
          document.getElementById('offender-table').innerHTML = `
            <h3>Perceived offender race (for ${selected} victims, ages 12–17)</h3>
            <table>
              <thead><tr><th>Offender race/ethnicity</th><th>Percent</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          `;
        };
        select.addEventListener('change', updateTable);
        updateTable();

        const notes = data.notes.map(n => `• ${n}`).join('<br>');
        document.getElementById('notes-area').innerHTML = `
          <strong>Sources:</strong><br>
          <a href="${data.source_ncvs_url}" target="_blank" rel="noopener">${data.source_ncvs}</a><br>
          <a href="${data.source_homicide_url}" target="_blank" rel="noopener">${data.source_homicide}</a><br><br>
          ${notes}
        `;
      }

      map.on('click', function() { closePanel(); });
      document.getElementById('country-select').addEventListener('change', function() {
        if (this.value !== 'us') { alert('Data for this country is not yet available.'); this.value = 'us'; }
      });
    });
    function closePanel() { document.getElementById('data-panel').classList.remove('open'); }
  </script>
</body>
</html>
