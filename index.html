<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child-Harm Data Explorer (Beta)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Josefin Sans', system-ui, sans-serif; background: #fff; color: #1a1a1a; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0.6rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 1.2rem; }
    .logo-img { height: 48px; width: auto; }
    .title-block { text-align: center; }
    .main-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .main-title .black { color: #000; }
    .main-title .blue { color: #0cc0df; }
    .badge { background: #0cc0df; color: white; font-size: 0.65rem; font-weight: 600; padding: 0.15rem 0.45rem; border-radius: 999px; margin-left: 0.5rem; vertical-align: middle; }
    .country-select { font-size: 0.82rem; padding: 0.3rem 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; background: white; max-width: 200px; }
    .country-select option:disabled { color: #9ca3af; }
    #map { height: calc(100vh - 68px); width: 100%; background: #f1f5f9; }
    #data-panel { position: fixed; top: 68px; right: -460px; width: 440px; height: calc(100vh - 68px); background: #fff; border-left: 1px solid #e5e7eb; box-shadow: -4px 0 24px rgba(0,0,0,0.10); padding: 1.75rem; overflow-y: auto; transition: right 0.3s ease; z-index: 3000; }
    #data-panel.open { right: 0; }
    #data-panel h2 { font-size: 1.35rem; margin-bottom: 0.2rem; font-weight: 700; }
    #data-panel .subtitle { color: #6b7280; font-size: 0.95rem; margin-bottom: 1rem; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.6rem; color: #9ca3af; cursor: pointer; }
    .close-btn:hover { color: #111; }
    label { font-size: 0.85rem; color: #374151; display: block; margin-bottom: 0.3rem; font-weight: 600; }
    label.missing-label { color: #dc2626; }
    select { width: 100%; padding: 0.45rem; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; font-family: inherit; }
    select.missing-select { border-color: #dc2626; color: #dc2626; }
    h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: #6b7280; margin: 1.2rem 0 0.6rem 0; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin-bottom: 0.5rem; }
    th, td { text-align: left; padding: 0.45rem 0.3rem; border-bottom: 1px solid #e5e7eb; }
    th { color: #6b7280; font-weight: 600; }
    .notes { font-size: 0.8rem; color: #6b7280; line-height: 1.45; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; }
    .notes a { color: #0cc0df; }
    .missing { color: #dc2626; font-weight: 600; }
    .legend { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: #6b7280; margin-top: 0.8rem; }
    .red-x { color: #dc2626; font-weight: bold; }
    .availability { background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 0.7rem; font-size: 0.85rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="Stop%20Bias%20Logo%20no%20tag%20980%20X%20200.png" alt="StopBias" class="logo-img">
      <div class="title-block">
        <div class="main-title">
          <span class="black">Child-</span><span class="blue">Harm Data</span><span class="black"> Explorer</span>
          <span class="badge">Beta</span>
        </div>
      </div>
    </div>
    <select id="country-select" class="country-select">
      <option value="all" disabled>All available countries (coming)</option>
      <option value="us" selected>United States</option>
      <option value="au" disabled>Australia (coming)</option>
      <option value="ca" disabled>Canada (coming)</option>
      <option value="fr" disabled>France (coming)</option>
      <option value="de" disabled>Germany (coming)</option>
      <option value="it" disabled>Italy (coming)</option>
      <option value="nz" disabled>New Zealand (coming)</option>
      <option value="za" disabled>South Africa (coming)</option>
      <option value="es" disabled>Spain (coming)</option>
      <option value="uk" disabled>United Kingdom (coming)</option>
    </select>
  </header>

  <div id="map"></div>

  <div id="data-panel">
    <button class="close-btn" onclick="closePanel()">×</button>
    <h2>United States</h2>
    <div class="subtitle">Child-related harm data</div>
    <div id="panel-content">Click a state to load data…</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const map = L.map('map').setView([39.5, -98], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 18 }).addTo(map);

      fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
        .then(r => r.json())
        .then(data => {
          const usaLayer = L.geoJSON(data, { style: { color: "#0cc0df", weight: 1.5, fillColor: "#0cc0df", fillOpacity: 0.25 } }).addTo(map);
          usaLayer.on('click', function(e) { L.DomEvent.stopPropagation(e); openPanel(); });
        });

      let usData = null;
      function loadData() {
        return fetch('us-data.json').then(r => { if (!r.ok) throw new Error('us-data.json not found'); return r.json(); })
          .then(data => { usData = data; return data; })
          .catch(err => { document.getElementById('panel-content').innerHTML = '<p class="missing">Could not load data: ' + err.message + '</p>'; throw err; });
      }
      loadData();

      function openPanel() {
        document.getElementById('data-panel').classList.add('open');
        if (usData) renderPanel(usData);
        else { document.getElementById('panel-content').innerHTML = 'Loading data…'; loadData().then(data => renderPanel(data)); }
      }

      function renderPanel(data) {
        const crimeOptions = data.crime_types.map(c => `<option value="${c}">${c}</option>`).join('');
        const raceOptions = data.victim_race_options.map(r => `<option value="${r}">${r}</option>`).join('');

        document.getElementById('panel-content').innerHTML = `
          <label for="crime-type">Crime type:</label>
          <select id="crime-type">${crimeOptions}</select>

          <label for="year-select">Year / period:</label>
          <select id="year-select"></select>

          <label for="victim-race">Victim race/ethnicity:</label>
          <select id="victim-race">${raceOptions}</select>

          <label for="perp-race" id="perp-label">Perpetrator race/ethnicity:</label>
          <select id="perp-race">${raceOptions}<option value="missing">✕ Not available</option></select>

          <label for="view-as">View as:</label>
          <select id="view-as">
            <option value="percentages">Percentages</option>
            <option value="rates">Rates (per 100,000)</option>
          </select>

          <div id="results"></div>

          <div class="availability">
            <strong>Data availability (beta):</strong> United States currently scores low (mostly 0–1 on a 0–4 scale) for child-harm data, especially on perpetrator demographics and victim × perpetrator cross-tabs. Provisional overall indicator: <span class="missing">Red</span>.
          </div>

          <div class="legend"><span class="red-x">✕</span> No official data published / not provided</div>
          <div class="notes" id="notes-area"></div>
        `;

        const crimeSelect = document.getElementById('crime-type');
        const yearSelect = document.getElementById('year-select');
        const raceSelect = document.getElementById('victim-race');
        const perpSelect = document.getElementById('perp-race');
        const perpLabel = document.getElementById('perp-label');
        const viewSelect = document.getElementById('view-as');

        function updateYears() {
          const crime = crimeSelect.value;
          const entry = data.data[crime];
          yearSelect.innerHTML = entry && entry.years ? `<option>${entry.years}</option>` : '<option>No years available</option>';
        }

        function updateResults() {
          const crime = crimeSelect.value;
          const race = raceSelect.value;
          const view = viewSelect.value;
          const entry = data.data[crime];
          const resultsDiv = document.getElementById('results');
          const perpAvailable = entry && entry.percentages && entry.percentages[race];

          if (perpAvailable) {
            perpLabel.classList.remove('missing-label');
            perpSelect.classList.remove('missing-select');
          } else {
            perpLabel.classList.add('missing-label');
            perpSelect.classList.add('missing-select');
            perpSelect.value = 'missing';
          }

          if (!entry) {
            resultsDiv.innerHTML = '<p class="missing">✕ No data for this crime type</p>';
            return;
          }

          if (view === 'percentages' && entry.percentages && entry.percentages[race]) {
            const row = entry.percentages[race];
            const rows = Object.entries(row).map(([off, pct]) => `<tr><td>${off}</td><td>${pct}%</td></tr>`).join('');
            resultsDiv.innerHTML = `
              <h3>Perceived offender race (${race} victims)</h3>
              <table><thead><tr><th>Offender</th><th>Percent</th></tr></thead><tbody>${rows}</tbody></table>
            `;
          } else if (view === 'rates' && entry.rates && entry.rates[race] !== undefined) {
            resultsDiv.innerHTML = `
              <h3>Victimization rate (${race} youth)</h3>
              <p style="font-size:1.1rem;font-weight:600;">${entry.rates[race]} per 100,000</p>
              <p class="missing" style="margin-top:0.6rem;">✕ Perpetrator race: No official data published</p>
            `;
          } else {
            resultsDiv.innerHTML = `<p class="missing">✕ No official ${view} data published for this combination</p>`;
          }
        }

        crimeSelect.addEventListener('change', () => { updateYears(); updateResults(); });
        raceSelect.addEventListener('change', updateResults);
        viewSelect.addEventListener('change', updateResults);
        perpSelect.addEventListener('change', updateResults);
        updateYears();
        updateResults();

        const notes = data.notes.map(n => `• ${n}`).join('<br>');
        document.getElementById('notes-area').innerHTML = `
          <strong>Sources:</strong><br>
          <a href="${data.sources.ncvs.url}" target="_blank" rel="noopener">${data.sources.ncvs.name}</a><br>
          <a href="${data.sources.homicide.url}" target="_blank" rel="noopener">${data.sources.homicide.name}</a><br><br>
          ${notes}
        `;
      }

      map.on('click', function() { closePanel(); });
      document.getElementById('country-select').addEventListener('change', function() {
        if (this.value !== 'us') { alert('Data for this country is not yet available.'); this.value = 'us'; }
      });
    });
    function closePanel() { document.getElementById('data-panel').classList.remove('open'); }
  </script>
</body>
</html>
