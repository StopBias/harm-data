<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StopBias – Harm Data Explorer (Beta)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; }
    .logo { font-size: 1.35rem; font-weight: 700; }
    .logo .stop { color: #000000; }
    .logo .bias { color: #0cc0df; }
    .tagline {
      font-size: 0.95rem;
      color: #6b7280;
      margin-left: 0.85rem;
      font-weight: 500;
    }
    .badge {
      background: #0cc0df;
      color: white;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      margin-left: 0.5rem;
    }
    .country-select {
      font-size: 0.9rem;
      padding: 0.4rem 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
    }
    .country-select option:disabled {
      color: #9ca3af;
    }
    #map {
      height: calc(100vh - 57px);
      width: 100%;
      background: #f1f5f9;
    }
    #data-panel {
      position: fixed;
      top: 57px;
      right: -440px;
      width: 420px;
      height: calc(100vh - 57px);
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      box-shadow: -4px 0 24px rgba(0,0,0,0.10);
      padding: 1.75rem;
      overflow-y: auto;
      transition: right 0.3s ease;
      z-index: 3000;
    }
    #data-panel.open { right: 0; }
    #data-panel h2 { font-size: 1.4rem; margin-bottom: 0.2rem; }
    #data-panel .subtitle { color: #6b7280; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: #9ca3af;
      cursor: pointer;
    }
    .close-btn:hover { color: #111; }
    h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b7280;
      margin: 1.5rem 0 0.6rem 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      margin-bottom: 0.5rem;
    }
    th, td {
      text-align: left;
      padding: 0.45rem 0.3rem;
      border-bottom: 1px solid #e5e7eb;
    }
    th { color: #6b7280; font-weight: 500; }
    .notes {
      font-size: 0.8rem;
      color: #6b7280;
      line-height: 1.45;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e5e7eb;
    }
    .notes a { color: #0cc0df; }
    .error { color: #dc2626; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">
        <span class="stop">Stop</span><span class="bias">Bias</span>
        <span class="badge">Beta</span>
      </div>
      <div class="tagline">Harm Data Explorer</div>
    </div>
    <select id="country-select" class="country-select">
      <option value="world" disabled>World (coming)</option>
      <option value="us" selected>United States</option>
      <option value="ca" disabled>Canada (coming)</option>
      <option value="uk" disabled>United Kingdom (coming)</option>
      <option value="de" disabled>Germany (coming)</option>
      <option value="fr" disabled>France (coming)</option>
      <option value="au" disabled>Australia (coming)</option>
      <option value="nz" disabled>New Zealand (coming)</option>
      <option value="za" disabled>South Africa (coming)</option>
    </select>
  </header>

  <div id="map"></div>

  <div id="data-panel">
    <button class="close-btn" onclick="closePanel()">×</button>
    <h2>United States</h2>
    <div class="subtitle">Juvenile victims (ages 0–17) of selected violent crimes, 2019–2023</div>
    <div id="panel-content">Click a state to load data…</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const map = L.map('map').setView([39.5, -98], 4);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 18
      }).addTo(map);

      fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
        .then(r => r.json())
        .then(data => {
          const usaLayer = L.geoJSON(data, {
            style: {
              color: "#0cc0df",
              weight: 1.5,
              fillColor: "#0cc0df",
              fillOpacity: 0.25
            }
          }).addTo(map);

          usaLayer.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            openPanel();
          });
        });

      let usData = null;

      function loadData() {
        return fetch('us-data.json')
          .then(r => {
            if (!r.ok) throw new Error('us-data.json not found (status ' + r.status + ')');
            return r.json();
          })
          .then(data => {
            usData = data;
            return data;
          })
          .catch(err => {
            console.error(err);
            document.getElementById('panel-content').innerHTML =
              '<p class="error">Could not load us-data.json<br>' + err.message + '</p>';
            throw err;
          });
      }

      loadData();

      function openPanel() {
        document.getElementById('data-panel').classList.add('open');
        if (usData) {
          renderPanel(usData);
        } else {
          document.getElementById('panel-content').innerHTML = 'Loading data…';
          loadData().then(data => renderPanel(data));
        }
      }

      function renderPanel(data) {
        const victimsRows = data.juvenile_victims.race
          .map(r => `<tr><td>${r.group}</td><td>${r.percent}%</td></tr>`)
          .join('');

        const offenderRows = data.offenders.race
          .map(r => `<tr><td>${r.group}</td><td>${r.percent}%</td></tr>`)
          .join('');

        const notes = data.notes.map(n => `• ${n}`).join('<br>');

        document.getElementById('panel-content').innerHTML = `
          <h3>Juvenile Victims (ages ${data.juvenile_victims.age_range}) – Race</h3>
          <table>
            <thead><tr><th>Group</th><th>Percent</th></tr></thead>
            <tbody>${victimsRows}</tbody>
          </table>
          <p style="font-size:0.85rem;color:#6b7280;margin:0.4rem 0 1rem 0;">
            Total known juvenile victims: ${data.juvenile_victims.total_known.toLocaleString()}
          </p>

          <h3>Offenders – Race</h3>
          <table>
            <thead><tr><th>Group</th><th>Percent</th></tr></thead>
            <tbody>${offenderRows}</tbody>
          </table>
          <p style="font-size:0.85rem;color:#6b7280;margin:0.4rem 0 1rem 0;">
            ${data.offenders.age_note}
          </p>

          <div class="notes">
            <strong>Source:</strong> <a href="${data.source_url}" target="_blank" rel="noopener">${data.source}</a><br><br>
            ${notes}
          </div>
        `;
      }

      map.on('click', function() {
        closePanel();
      });

      // Country selector (placeholder for future)
      document.getElementById('country-select').addEventListener('change', function() {
        if (this.value !== 'us') {
          alert('Data for this country is not yet available.');
          this.value = 'us';
        }
      });
    });

    function closePanel() {
      document.getElementById('data-panel').classList.remove('open');
    }
  </script>
</body>
</html>
